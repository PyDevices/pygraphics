name: Unit tests

# pygraphics had no test CI until 2026-08. tests/_support.py was never committed,
# so five of the fifteen test modules failed at import and nobody saw it. This job
# exists so that cannot recur silently.

on:
  push:
    branches: [main]
    paths:
      - 'lib/**'
      - 'src/**'
      - 'tests/**'
      - 'scripts/**'
      - 'pyproject.toml'
      - '.github/workflows/tests.yml'
  pull_request:
    paths:
      - 'lib/**'
      - 'src/**'
      - 'tests/**'
      - 'scripts/**'
      - 'pyproject.toml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install ruff
        run: pip install ruff
      - name: Ruff
        run: ruff check lib tests
      # Pure-Python mode; tests/_env.py puts lib/ on sys.path. Note PYTHONPATH
      # alone does NOT select it -- the cwd precedes PYTHONPATH on sys.path, so
      # an in-place native build would win. _env.py is the switch.
      #
      # A PYGRAPHICS_TEST_NATIVE=1 job belongs here too, but the native build
      # currently has 11 divergences from the pure-Python reference (see
      # tests/README.md); adding it now would fail every push.
      - name: Unit tests (pure Python)
        run: python -m unittest discover -s tests -v
