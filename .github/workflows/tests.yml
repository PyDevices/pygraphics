name: Unit tests

# pygraphics had no test CI until 2026-08. tests/_support.py was never committed,
# so five of the fifteen test modules failed at import and nobody saw it. This job
# exists so that cannot recur silently.

on:
  push:
    branches: [main]
    paths:
      - 'lib/**'
      - 'src/**'
      - 'tests/**'
      - 'scripts/**'
      - 'pyproject.toml'
      - '.github/workflows/tests.yml'
  pull_request:
    paths:
      - 'lib/**'
      - 'src/**'
      - 'tests/**'
      - 'scripts/**'
      - 'pyproject.toml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install ruff
        run: pip install ruff
      - name: Ruff
        run: ruff check lib tests
      # tests/_env.py is the implementation switch. Note PYTHONPATH alone does
      # NOT select pure Python -- the cwd precedes PYTHONPATH on sys.path, so an
      # in-place native build would win.
      - name: Unit tests (pure Python)
        run: python -m unittest discover -s tests -v

      # Both implementations must agree. Eleven divergences were found and fixed
      # in August 2026 once the suite could actually run; this job is what keeps
      # them from coming back.
      - name: Build the native extension
        run: |
          pip install "setuptools>=77" wheel
          python setup.py build_ext --inplace

      - name: Unit tests (native extension)
        env:
          PYGRAPHICS_TEST_NATIVE: '1'
        run: python -m unittest discover -s tests -v
