[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pydevices-pygraphics"
version = "0.0.25"
description = "Pure-Python graphics (FrameBuffer, Draw, fonts); import as pygraphics"
readme = "pygraphics/README.md"
license = "MIT"
requires-python = ">=3.8"
authors = [{ name = "Brad Barnett", email = "contact@pydevices.com" }]
urls = { Homepage = "https://github.com/PyDevices/pygraphics", Issues = "https://github.com/PyDevices/pygraphics/issues" }

[tool.hatch.build.targets.wheel]
packages = ["pygraphics"]

[tool.hatch.build.targets.sdist]
include = ["pygraphics"]
