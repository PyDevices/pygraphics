[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pygraphics"
dynamic = ["version"]
description = "Native graphics cmod for CPython (FrameBuffer, Area); import as pygraphics"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
urls = { Homepage = "https://github.com/PyDevices/pygraphics", Issues = "https://github.com/PyDevices/pygraphics/issues" }

[tool.setuptools]
packages = []

[tool.setuptools.dynamic]
version = { file = "VERSION" }

# Wheel CI: one wheel per CPython minor (cp310…cp314) × Linux + Windows + Android,
# plus a separate Pyodide pyemscripten_2026_0 wasm32 wheel (see publish-testpypi.yml).
[tool.cibuildwheel]
build = "cp310-* cp311-* cp312-* cp313-* cp314-*"
skip = "*musllinux* *-macosx_* *-win32"
test-command = "python -c \"import pygraphics; from pygraphics import FrameBuffer, RGB565, framebuf_backend; assert framebuf_backend() == 'native'\""

[tool.cibuildwheel.linux]
archs = ["x86_64"]
manylinux-x86_64-image = "manylinux_2_28"

[tool.cibuildwheel.windows]
archs = ["AMD64"]

# Phones/TVs: arm64_v8a (primary) + armeabi_v7a (older 32-bit devices/sticks).
# Emulators: x86_64 (typical PC AVD). API 21 tags remain installable when the
# app minSdk is higher (e.g. p4a android.minapi = 24).
[tool.cibuildwheel.android]
archs = ["arm64_v8a", "armeabi_v7a", "x86_64"]
environment = { ANDROID_API_LEVEL = "21" }
test-command = "python -c \"import pygraphics; assert pygraphics.framebuf_backend() == 'native'\""
test-skip = "*"

[[tool.cibuildwheel.overrides]]
select = "*-android_*"
build-frontend = "build"
